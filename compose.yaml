services:
  clash-converter:
    build: .
    image: clash-subscription-converter:latest
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-360}
      ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS:-false}
      LATENCY_TIMEOUT_MS: ${LATENCY_TIMEOUT_MS:-5000}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - clash-converter-data:/data

volumes:
  clash-converter-data:
